<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#141527">
<title>Coding Jam Session 2 · Classroom Cue</title>
<style>
:root{color-scheme:dark;--background:#141527;--panel:#1b1d32;--ink:#f7f6ff;--sub:#c3c4d9;--line:#ffffff26;--accent:#d4f98b;--font:"Avenir Next",Avenir,system-ui,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 9% 17%,#2a284b 0%,transparent 48%),var(--background);color:var(--ink);font:500 1rem/1.45 var(--font)}
button,a{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.page{width:min(100%,1800px);min-height:100dvh;margin:auto;padding:clamp(18px,3.25vw,56px);display:grid;grid-template-rows:auto 1fr auto auto;gap:clamp(18px,3vh,31px)}
.mast{display:flex;gap:24px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:clamp(12px,2vh,24px)}
.brand{display:flex;align-items:center;gap:14px}
.mark{width:19px;height:19px;background:var(--accent);box-shadow:5px 5px 0 #8b7cde;transform:rotate(-12deg);border-radius:4px;margin:0 8px 5px 2px}
.brand strong{display:block;font-size:clamp(1rem,1.9vw,1.7rem);letter-spacing:-.025em}
.brand span,.clock span{color:var(--sub);font-size:clamp(.72rem,1vw,.9rem)}
.clock{text-align:right;white-space:nowrap}
.clock time{display:block;font-size:clamp(1rem,2vw,1.8rem);font-variant-numeric:tabular-nums}
.board{align-self:center;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(350px,1fr);gap:clamp(22px,4vw,67px);align-items:center}
.eyebrow{color:var(--accent);letter-spacing:.12em;text-transform:uppercase;font-weight:740;font-size:clamp(.76rem,1.1vw,1rem);margin:0 0 10px}
h1{font-size:clamp(2.2rem,5.55vw,6rem);line-height:1.01;margin:0;letter-spacing:-.065em;text-wrap:balance}
.instructions{margin:clamp(14px,3vh,29px) 0 0;padding:0;list-style:none;display:grid;gap:clamp(7px,1.6vh,16px);font-size:clamp(1rem,2.04vw,2.05rem);line-height:1.25}
.instructions li{position:relative;padding-left:1.12em;color:var(--ink)}
.instructions li::before{content:"";position:absolute;top:.46em;left:0;width:.31em;height:.31em;border-radius:50%;background:var(--accent)}
.dial{padding:clamp(15px,3.2vw,52px);background:linear-gradient(138deg,#252644,var(--panel));border:1px solid var(--line);border-radius:clamp(15px,2.3vw,32px);box-shadow:0 16px 60px #08091845}
.dial>p{margin:0;color:var(--sub);font-size:clamp(.79rem,1.35vw,1.24rem);font-weight:650}
.dial>time{display:block;color:var(--accent);font-weight:650;font-variant-numeric:tabular-nums;font-size:clamp(3.1rem,8.75vw,9.2rem);line-height:1.04;letter-spacing:-.075em;white-space:nowrap;margin:8px 0 17px}
.meter{height:8px;border-radius:20px;background:#ffffff21;overflow:hidden}
.meter span{display:block;height:100%;width:100%;transform-origin:left;background:var(--accent);border-radius:inherit;transition:transform .25s linear}
.dial .time-window{margin-top:15px;font-size:clamp(.76rem,1.15vw,1.1rem);font-variant-numeric:tabular-nums}
.steps{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.steps li{border-top:3px solid var(--line);padding:10px 3px 0;color:var(--sub);font-size:clamp(.79rem,1.13vw,1rem);line-height:1.14;min-width:0}
.steps time{display:block;font-size:.79em;font-variant-numeric:tabular-nums;margin-bottom:5px}
.steps [aria-current="step"]{border-color:var(--accent);color:var(--ink);font-weight:740}
.steps .past{border-color:#938ab2;color:#c5bed7}
.foot{min-height:49px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:11px;padding-top:9px;border-top:1px solid var(--line)}
.foot p{margin:0;font-size:.9rem;color:var(--sub)}
.controls{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.control{border:1px solid #ffffff38;background:#24253e;border-radius:9px;padding:8px 12px;color:var(--ink);text-decoration:none;font-size:.9rem;white-space:nowrap}
.control:hover{background:#393858}
.primary{color:#172319;background:var(--accent);border:1px solid var(--accent);font-weight:780;padding:10px 15px}
.primary:hover{background:#e7ffbe}
.next{font-weight:700;color:var(--ink)}
.notice{color:#ffe1a3!important}
.rehearsal{position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:4;background:#ffdb93;color:#302118;border-radius:30px;padding:4px 15px;font-size:.73rem;font-weight:790;white-space:nowrap}
.movie{position:fixed;inset:0;background:#080910;z-index:2;display:grid;place-items:center}
.movie video{width:100%;height:100%;max-height:100dvh;object-fit:contain}
.movie .message{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;padding:30px;background:#121326eb}
.message p{max-width:33ch;color:var(--sub)}
.movie-tools{position:absolute;right:13px;top:13px;display:flex;gap:7px}
@media (max-width:820px){.board{grid-template-columns:minmax(0,1fr);gap:16px}.dial{padding:16px 22px}.dial>time{font-size:clamp(3.3rem,14vw,6rem);margin:4px 0 12px}.instructions{margin:14px 0 0}.steps{grid-template-columns:repeat(4,1fr);row-gap:13px}.foot{align-items:flex-start;flex-direction:column}.page{gap:19px}.brand{gap:6px}}
@media (min-width:821px) and (max-height:710px){.page{padding:20px 30px;gap:14px}h1{font-size:clamp(2.4rem,5vw,5rem)}.dial{padding:21px 30px}.instructions{margin-top:16px}}
@media (prefers-reduced-motion:reduce){.meter span{transition:none}}
</style>
</head>
<body>
<div class="page" id="page">
  <header class="mast">
    <div class="brand"><span class="mark" aria-hidden="true"></span><div><strong>Coding Jam</strong><span>Session 2 · Classroom cue</span></div></div>
    <div class="clock"><time id="clock"></time><span id="clock-zone">Kuala Lumpur</span></div>
  </header>
  <main class="board">
    <section aria-labelledby="title" aria-live="polite">
      <p class="eyebrow" id="phase">3:00–4:00 pm</p>
      <h1 id="title">Ready for Coding Jam?</h1>
      <ul class="instructions" id="instructions"><li>Open this timer on the projector.</li><li>Choose “Arm 3:00 pm timer” before class starts.</li></ul>
    </section>
    <aside class="dial" aria-label="Stage timer">
      <p id="timer-label">Lesson starts at</p>
      <time id="remaining">3:00</time>
      <div class="meter" aria-hidden="true"><span id="progress"></span></div>
      <p class="time-window" id="window">3:00–4:00 pm</p>
    </aside>
  </main>
  <ol class="steps" id="steps" aria-label="Session timetable"></ol>
  <footer class="foot">
    <p><span class="next" id="next"></span><span class="notice" id="notice" role="status"></span></p>
    <div class="controls">
      <a class="control" href="https://mrdavekang.github.io/coding-jam-studio/session-2/" target="_blank" rel="noopener">Student lesson ↗</a>
      <button class="control" id="test-chime" type="button">Test chime</button>
      <button class="control" id="toggle-chime" type="button" aria-pressed="true">Chimes on</button>
      <button class="control" id="rehearse" type="button">Rehearse</button>
      <button class="control" id="fullscreen" type="button" hidden>Full screen</button>
      <button class="control primary" id="arm" type="button">Arm 3:00 pm timer</button>
      <button class="control" id="stop" type="button" hidden>Stop rehearsal</button>
    </div>
  </footer>
</div>
<p class="rehearsal" id="rehearsal-flag" hidden>REHEARSAL · Classroom clock unaffected</p>
<section class="movie" id="movie" aria-label="Coding Jam overview video" hidden>
  <video id="video" src="./classroom-cue-overview.mp4" preload="auto" playsinline aria-label="Coding Jam overview with English and Korean subtitles"></video>
  <div class="message" id="movie-message" hidden>
    <p id="movie-warning" role="status"></p>
    <button class="control primary" id="play" type="button">Play overview</button>
  </div>
  <div class="movie-tools">
    <button class="control" id="video-fullscreen" type="button" hidden>Full screen</button>
    <button class="control" id="preview-ending" type="button" hidden>Preview ending</button>
    <button class="control" id="stop-video-rehearsal" type="button" hidden>Stop rehearsal</button>
  </div>
</section>
<noscript><p>Enable JavaScript to run the timer and play the overview.</p></noscript>
<script>
"use strict";
const lesson = [
  {at:0, name:"Set up", title:"Get ready", accent:"#d4f98b", items:["Get into teams of 2 or 3.", "Open Coding Jam Studio · Session 2.", "Be ready to watch the overview."]},
  {at:120, name:"Overview", title:"Watch the overview", accent:"#d4f98b", video:true},
  {at:530, name:"Practise", title:"Try the four practice tasks", accent:"#d4f98b", items:["Find the sprite, connect blocks, predict the result and fix a mistake.", "Agree on an answer before you check it.", "Open the worked example if you get stuck."]},
  {at:1080, name:"Choose", title:"Pick a project and roles", accent:"#cbbaff", items:["Choose Campus Quest, The Lantern Trail or Room Sentinel.", "Choose a driver, navigator and tester. In pairs, share testing.", "Agree who it helps and do the project’s quick check."]},
  {at:1440, name:"Build", title:"Make one feature work", accent:"#a3e8fe", items:["Open the starter and follow the guide one card at a time.", "Get one click or button press to do what you expect.", "Show your teammate. Then swap drivers."]},
  {at:2640, name:"Plot twist", title:"A new user tries it alone", accent:"#ffd98c", items:["They have to know what to do without your help.", "Add one short instruction that tells them what to click or press.", "Get it ready for someone else to try."]},
  {at:2820, name:"Playtest", title:"Test it with another team", accent:"#f5b9e8", items:["Give them the first click or button press.", "Watch where they get stuck.", "Fix one thing that makes it easier to use."]},
  {at:3240, name:"Save & show", title:"Save and give a 20-second demo", accent:"#b8f2d8", items:["Save or download your project file where you can find it.", "Tell a nearby team who it helps.", "Show one feature working, then swap."]},
  {at:3600,name:"Finish", title:"Time’s up", accent:"#d4f98b", items:["Check that your project file is saved.", "Wait for your teacher before you pack away."]}
];
const $ = id => document.getElementById(id);
const video = $("video");
const movie = $("movie");
const clock = new Intl.DateTimeFormat("en-GB", {
  timeZone:"Asia/Kuala_Lumpur",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"
});
const lessonStartSeconds = 15 * 3600;
const videoIndex = lesson.findIndex(stage => stage.video);
const practiceIndex = videoIndex + 1;
const videoStart = lesson[videoIndex].at;
const practiceStart = lesson[practiceIndex].at;
const titleTime = seconds => {
  const t = lessonStartSeconds + seconds;
  const h = Math.floor(t / 3600);
  const m = Math.floor(t / 60) % 60;
  const s = Math.floor(t) % 60;
  return `${h % 12 || 12}:${String(m).padStart(2,"0")}${s ? ":" + String(s).padStart(2,"0") : ""}`;
};
const countdown = seconds => {
  const whole = Math.max(0,Math.ceil(seconds));
  return `${String(Math.floor(whole / 60)).padStart(2,"0")}:${String(whole % 60).padStart(2,"0")}`;
};
function getLiveAnchor(now) {
  const parts = Object.fromEntries(clock.formatToParts(now).map(({type,value}) => [type,Number(value)]));
  const secondsToday = parts.hour * 3600 + parts.minute * 60 + parts.second;
  return Math.floor(now / 1000) * 1000 + (lessonStartSeconds - secondsToday) * 1000;
}
function getStage(seconds) {
  return lesson.findLastIndex(stage => seconds >= stage.at);
}

let mode = "idle";
let liveAnchor = 0;
let rehearsalAnchor = 0;
let shown = null;
let chimes = true;
let audio;
let audioGate;
let priming = false;
let playbackSize = 0;
let videoEnded = false;
let videoRequested = false;
let chimeNodes = [];
let startingFrom = 0;

video.addEventListener("loadedmetadata",() => { playbackSize = video.duration; });

const rail = lesson.slice(0,-1).map((stage,index) => {
  const li = document.createElement("li");
  const when = document.createElement("time");
  when.textContent = titleTime(stage.at);
  li.append(when,stage.name);
  $("steps").append(li);
  return li;
});
function nativeFullscreen() {
  if (document.fullscreenElement || document.webkitFullscreenElement) return Promise.resolve();
  const root = document.documentElement;
  try {
    if (root.requestFullscreen) return Promise.resolve(root.requestFullscreen());
    if (root.webkitRequestFullscreen) {
      root.webkitRequestFullscreen();
      return Promise.resolve();
    }
  } catch (error) {
    return Promise.reject(error);
  }
  return Promise.reject(new Error("Full screen unavailable"));
}
function showFullscreenNotice() {
  $("notice").textContent = "  Full screen unavailable here. Use your browser’s full-screen command.";
  updateFullscreenButtons();
}
function updateFullscreenButtons() {
  const fullscreen = document.fullscreenElement || document.webkitFullscreenElement;
  $("fullscreen").hidden = !!fullscreen || mode === "idle";
  $("video-fullscreen").hidden = !!fullscreen;
}
function unlockChime() {
  const Context = window.AudioContext || window.webkitAudioContext;
  if (!Context) return;
  try {
    if (!audio) {
      audio = new Context();
      audioGate = audio.createGain();
      audioGate.connect(audio.destination);
    }
    audio.resume().catch(() => {});
  } catch {
    $("notice").textContent = "  This browser’s chime could not be enabled.";
  }
}
function stopChime() {
  if (!audio) return;
  audioGate.gain.setValueAtTime(0,audio.currentTime);
  for (const oscillator of chimeNodes) {
    try { oscillator.stop(); } catch {}
  }
  chimeNodes = [];
}
function ring() {
  if (!chimes || !audio || shown === videoIndex || !movie.hidden) return;
  const start = audio.currentTime + 0.018;
  audioGate.gain.setValueAtTime(1,audio.currentTime);
  for (const [time,pitch] of [[0,659.25],[0.17,880]]) {
    const tone = audio.createOscillator();
    const envelope = audio.createGain();
    const attack = start + time;
    tone.type = "sine";
    tone.frequency.value = pitch;
    envelope.gain.setValueAtTime(0.001,attack);
    envelope.gain.exponentialRampToValueAtTime(0.14,attack + 0.035);
    envelope.gain.exponentialRampToValueAtTime(0.001,attack + 0.39);
    tone.connect(envelope).connect(audioGate);
    tone.onended = () => { chimeNodes = chimeNodes.filter(node => node !== tone); };
    tone.start(attack);
    tone.stop(attack + 0.39);
    chimeNodes.push(tone);
  }
}
function primeMedia() {
  // Grant this video element playback during the initial user gesture.
  priming = true;
  video.volume = 0;
  const finish = () => {
    video.pause();
    video.currentTime = 0;
    video.volume = 1;
    priming = false;
    render();
  };
  video.play().then(finish,finish);
}
function showVideoError(message) {
  if (movie.hidden) return;
  $("movie-warning").textContent = message;
  $("movie-message").hidden = false;
}
function playOverview(seconds = startingFrom) {
  if (movie.hidden || priming) return;
  videoRequested = true;
  $("movie-message").hidden = true;
  if (video.paused && !videoEnded) {
    video.currentTime = Math.min(Math.max(0,seconds),Math.max(0,(playbackSize || 409.38) - 0.15));
  }
  video.play().catch(error => {
    if (error.name !== "AbortError") {
      showVideoError("Select Play overview to enable playback in this browser.");
    }
  });
}
function currentSeconds(now) {
  if (mode === "rehearsal") return (performance.now() - rehearsalAnchor) / 1000;
  return (now - liveAnchor) / 1000;
}
function cueStage(seconds) {
  const index = getStage(seconds);
  if (mode === "rehearsal" && videoEnded && index === videoIndex) return practiceIndex;
  // Finish the final seconds of a running video if the first frame was delayed.
  if (index === practiceIndex && shown === videoIndex && !videoEnded && videoRequested &&
      !video.paused && seconds < practiceStart + 10) return videoIndex;
  if (index === videoIndex && videoEnded) return practiceIndex;
  return index;
}
function setPresentation(index,seconds) {
  const previous = shown;
  shown = index;
  if (index === videoIndex) {
    stopChime();
    startingFrom = Math.max(0,seconds - videoStart);
    movie.hidden = false;
    $("page").inert = true;
    if (!priming) playOverview();
    return;
  }
  if (!movie.hidden) {
    video.pause();
    movie.hidden = true;
    $("page").inert = false;
  }

  document.documentElement.style.setProperty("--accent",lesson[Math.max(0,index)]?.accent || "#d4f98b");
  const stage = lesson[index];
  $("phase").textContent = index < 0 ? "3:00–4:00 pm" : index === lesson.length - 1 ? "4:00 pm · Session complete" : titleTime(stage.at) + " pm";
  $("title").textContent = stage?.title || (mode === "live" ? "Ready for 3:00 pm" : "Ready for Coding Jam?");
  const items = stage?.items || (mode === "live"
    ? ["The setup timer will start automatically.", "Keep this page open on the projector."]
    : ["Open this timer on the projector.", "Choose “Arm 3:00 pm timer” before class starts."]);
  $("instructions").replaceChildren(...items.map(text => {
    const li = document.createElement("li"); li.textContent = text; return li;
  }));
  for (const [i,node] of rail.entries()) {
    node.classList.toggle("past",i < index);
    if (i === index) node.setAttribute("aria-current","step");
    else node.removeAttribute("aria-current");
  }
  const next = lesson[index + 1];
  $("next").textContent = next ? `Next · ${titleTime(next.at)} pm · ${next.name}` : "Coding Jam · Session 2";
  const nearStart = stage && Math.abs(seconds - stage.at) < 1.2;
  if (mode !== "idle" && stage && (nearStart || (previous !== null && index > previous))) ring();
}
function render() {
  const now = Date.now();
  const seconds = mode === "idle" ? -1 : currentSeconds(now);
  const date = new Date(now);
  $("clock").textContent = mode === "rehearsal" ? titleTime(Math.max(0,seconds)) + " pm" : clock.format(date);
  $("clock-zone").textContent = mode === "rehearsal" ? "Rehearsal clock" : "Kuala Lumpur";
  const index = cueStage(seconds);
  if (index !== shown) setPresentation(index,seconds);
  if (index === videoIndex) {
    if (!priming && !videoRequested) playOverview(Math.max(0,seconds - videoStart));
    return;
  }
  const stage = lesson[index];
  const next = lesson[index + 1];
  const left = next ? next.at - seconds : 0;
  const untilStart = index < 0 && mode === "live";
  $("remaining").textContent = index < 0 && !untilStart ? "3:00" : countdown(left);
  $("timer-label").textContent = index < 0 && !untilStart ? "Lesson starts at" : untilStart ? "Until setup" : next ? "Time remaining" : "Lesson complete";
  $("window").textContent = stage && next ? `${titleTime(stage.at)}–${titleTime(next.at)} pm` : "3:00–4:00 pm";
  const ratio = stage && next ? left / (next.at - stage.at) : index < 0 ? 1 : 0;
  $("progress").style.transform = `scaleX(${Math.max(0,Math.min(1,ratio))})`;
}
function begin(kind) {
  stopChime();
  mode = kind;
  shown = null;
  videoRequested = false;
  videoEnded = false;
  liveAnchor = getLiveAnchor(Date.now());
  rehearsalAnchor = performance.now() - (videoStart - 5) * 1000;
  $("notice").textContent = "";
  const rehearsal = kind === "rehearsal";
  $("preview-ending").hidden = !rehearsal;
  $("rehearsal-flag").hidden = !rehearsal;
  $("rehearse").hidden = true;
  $("arm").hidden = true;
  $("test-chime").hidden = true;
  $("stop").hidden = !rehearsal;
  $("stop-video-rehearsal").hidden = !rehearsal;
  unlockChime();
  if (getStage(currentSeconds(Date.now())) !== videoIndex) primeMedia();
  render();
  nativeFullscreen().then(updateFullscreenButtons,showFullscreenNotice);
  updateFullscreenButtons();
}
function stopRehearsal() {
  mode = "idle";
  shown = null;
  videoEnded = false;
  videoRequested = false;
  $("movie-message").hidden = true;
  $("preview-ending").hidden = true;
  $("rehearsal-flag").hidden = true;
  $("stop-video-rehearsal").hidden = true;
  $("stop").hidden = true;
  $("fullscreen").hidden = true;
  $("arm").hidden = false;
  $("rehearse").hidden = false;
  $("test-chime").hidden = false;
  stopChime();
  render();
}
video.addEventListener("ended",() => {
  if (movie.hidden || priming) return;
  videoEnded = true;
  if (mode === "rehearsal") rehearsalAnchor = performance.now() - practiceStart * 1000;
  render();
});
video.addEventListener("error",() => showVideoError("The overview could not be loaded. Open this file in Chrome or Edge."));
$("preview-ending").onclick = () => {
  if (mode === "rehearsal" && playbackSize > 3) {
    video.currentTime = playbackSize - 3;
    if (video.paused) playOverview(playbackSize - 3);
  }
};
$("play").onclick = () => playOverview(Math.max(0,currentSeconds(Date.now()) - videoStart));
$("arm").onclick = () => begin("live");
$("rehearse").onclick = () => begin("rehearsal");
$("stop").onclick = $("stop-video-rehearsal").onclick = stopRehearsal;
$("fullscreen").onclick = $("video-fullscreen").onclick = () => nativeFullscreen().then(updateFullscreenButtons,showFullscreenNotice);
$("test-chime").onclick = () => { unlockChime(); ring(); };
$("toggle-chime").onclick = () => {
  chimes = !chimes;
  if (chimes) unlockChime();
  else stopChime();
  $("toggle-chime").textContent = chimes ? "Chimes on" : "Chimes off";
  $("toggle-chime").setAttribute("aria-pressed",String(chimes));
};
document.addEventListener("fullscreenchange",updateFullscreenButtons);
document.addEventListener("webkitfullscreenchange",updateFullscreenButtons);
document.addEventListener("visibilitychange",render);
render();
setInterval(render,100);
</script>
</body>
</html>
