<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#182344">
  <meta name="description" content="Practise coding with short tasks, then build a Scratch or MakeCode micro:bit project through 20 cards.">
  <title>Session 2 · Coding Jam Studio</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./session.css">
</head>
<body>
  <a class="skip" href="#activity">Skip to the activity</a>
  <header class="top-bar">
    <div class="top-inner">
      <a class="studio" href="../"><img src="../favicon.svg" width="36" height="36" alt="">Coding Jam Studio</a>
      <span class="session-label">Session 2</span>
      <a class="teacher-link" href="#teacher">Teacher guide</a>
    </div>
  </header>
  <div class="lesson">
    <aside id="lesson-progress" aria-label="Lesson progress"></aside>
    <main id="activity" tabindex="-1">
      <noscript><p>Turn on JavaScript to use the Scratch practice and project guide.</p></noscript>
    </main>
  </div>
  <template id="teacher-content">
    <article class="task-card teacher-card">
      <p class="eyebrow">60 minutes · Teams of 2–3</p>
      <h1>Teacher guide</h1>
      <p>Brief the class on the Coding Jam goal. Create a digital solution that could make a positive difference to your school, community or wider society. Students can build with any tool they know. The shared practice models Scratch. The project routes use Scratch or MakeCode.</p>
      <details class="support">
        <summary>Get the demos and preview the 20-card guides</summary>
        <p>Open the Scratch demos with <strong>File → Load from your computer</strong>. For Room Sentinel, use the matching MakeCode reference and set a threshold for your own room.</p>
        <ul>
          <li><a href="./assets/examples/find-your-way-example.sb3" download>Campus Quest demo (.sb3)</a> · <a href="?preview=1&amp;project=find-your-way#card-1">Preview its cards</a></li>
          <li><a href="./assets/examples/playground-choices-example.sb3" download>The Lantern Trail demo (.sb3)</a> · <a href="?preview=1&amp;project=playground-choices#card-1">Preview its cards</a></li>
          <li><a href="./assets/makecode/room-sentinel-grove.txt" download>Room Sentinel Grove reference</a> · <a href="./assets/makecode/room-sentinel-simulator.txt" download>Simulator reference</a> · <a href="?preview=1&amp;project=switch-off-checker#card-1">Preview its cards</a></li>
        </ul>
      </details>
      <table>
        <thead><tr><th scope="col">Minute</th><th scope="col">Activity</th></tr></thead>
        <tbody>
          <tr><th scope="row">00–06</th><td>Show one click in each working demo. Ask who it helps.</td></tr>
          <tr><th scope="row">06–18</th><td>Complete four short practice tasks. Open a worked example together if pupils get stuck.</td></tr>
          <tr><th scope="row">18–24</th><td>Choose a project and try its quick check. Assign a driver, a navigator and a tester if there are three pupils.</td></tr>
          <tr><th scope="row">24–44</th><td>Get a first prototype working. Start with cards 1–12 and swap drivers along the way. Save cards 13–16 for teams ready to extend their build.</td></tr>
          <tr><th scope="row">44–54</th><td>Invite another team to try it. Improve one thing that was confusing.</td></tr>
          <tr><th scope="row">54–60</th><td>Save the .sb3 or MakeCode .hex file and show one working feature.</td></tr>
        </tbody>
      </table>
      <p><strong>Coach prompt</strong> “Show me the last thing that worked. What should happen on the next click?” One working response is enough for a first demo.</p>
      <button class="primary" type="button" data-step="resume">Back to the student lesson</button>
    </article>
  </template>
  <footer><a href="../">Coding Jam Studio</a><a href="https://www.scratchfoundation.org/learn/learning-library/getting-started" target="_blank" rel="noopener">Scratch Foundation ↗</a><span>Practice progress is saved on this device.</span></footer>
  <dialog id="image-dialog" aria-labelledby="image-title">
    <header><h2 id="image-title">Scratch screenshot</h2><button type="button" data-close aria-label="Close screenshot">×</button></header>
    <div id="image-body"></div>
  </dialog>
  <script type="module" src="./session.js"></script>
</body>
</html>
